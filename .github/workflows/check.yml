name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install extension packaging tool
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-shexli.txt
      - name: Install pinned static analyzer
        run: python -m pip install -r requirements-shexli.txt
      - name: Test analyzer gate
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Package extension
        run: ./scripts/package.sh
      - name: Analyze installable package
        run: python scripts/check-package.py dist/fuzzy-clock-gb@nedrichards.shell-extension.zip
      - name: Retain full static analysis report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: shexli-report-${{ github.sha }}
          path: dist/shexli/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload tested extension package
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: gnome-fuzzy-clock-gb-${{ github.sha }}
          path: dist/*.shell-extension.zip
          if-no-files-found: error
          retention-days: 14
      - name: Summarize package
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "Tested checkout: $GITHUB_SHA"
            echo "Download: $ARTIFACT_URL"
            echo 'Retention: 14 days'
          } >> "$GITHUB_STEP_SUMMARY"
