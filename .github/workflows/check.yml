name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: 13 7 * * 3
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install extension packaging tool
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell
      - run: npm ci
      - name: Load pure extension modules with native GJS
        run: |
          gjs -m fuzzyTime.js
      - run: npm test
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-shexli.txt
      - name: Install pinned static analyzer
        run: python -m pip install -r requirements-shexli.txt
      - name: Test analyzer gate
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Package extension
        run: ./scripts/package.sh
      - name: Analyze installable package
        run: python scripts/check-package.py dist/fuzzy-clock-gb@nedrichards.shell-extension.zip
      - name: Retain full static analysis report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: shexli-report-${{ github.sha }}-${{ matrix.arch }}
          path: dist/shexli/
          if-no-files-found: warn
          retention-days: 14
      - name: Record tested package provenance
        run: |
          printf 'Built checkout: %s\nRunner architecture: %s\n' "$GITHUB_SHA" "$RUNNER_ARCH" > dist/BUILD_INFO.txt
          (cd dist && sha256sum -- *.shell-extension.zip > SHA256SUMS)
      - name: Upload tested extension package
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: gnome-fuzzy-clock-gb-${{ github.sha }}-${{ matrix.arch }}
          path: |
            dist/*.shell-extension.zip
            dist/BUILD_INFO.txt
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Summarize package
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "Tested checkout: $GITHUB_SHA"
            echo "Download: $ARTIFACT_URL"
            echo 'Retention: 14 days'
          } >> "$GITHUB_STEP_SUMMARY"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
  compatibility:
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: current
          cache: npm
      - name: Install extension packaging tool
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell
      - run: npm ci
      - name: Load pure extension modules with native GJS
        run: |
          gjs -m fuzzyTime.js
      - run: npm test
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-shexli.txt
      - name: Install pinned static analyzer
        run: python -m pip install -r requirements-shexli.txt
      - name: Test analyzer gate
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Package extension
        run: ./scripts/package.sh
      - name: Analyze installable package
        run: python scripts/check-package.py dist/fuzzy-clock-gb@nedrichards.shell-extension.zip
      - name: Retain full static analysis report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: compatibility-shexli-report-${{ github.sha }}-${{ matrix.arch }}
          path: dist/shexli/
          if-no-files-found: warn
          retention-days: 14
      - name: Record tested package provenance
        run: |
          printf 'Built checkout: %s\nRunner architecture: %s\n' "$GITHUB_SHA" "$RUNNER_ARCH" > dist/BUILD_INFO.txt
          (cd dist && sha256sum -- *.shell-extension.zip > SHA256SUMS)
      - name: Upload tested extension package
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: compatibility-gnome-fuzzy-clock-gb-${{ github.sha }}-${{ matrix.arch }}
          path: |
            dist/*.shell-extension.zip
            dist/BUILD_INFO.txt
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Summarize package
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "Tested checkout: $GITHUB_SHA"
            echo "Download: $ARTIFACT_URL"
            echo 'Retention: 14 days'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Audit locked JavaScript dependencies
        run: npm audit --audit-level=high
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    name: Current Node compatibility (${{ matrix.arch }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
